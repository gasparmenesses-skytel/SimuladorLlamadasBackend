server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API, el estado y los tonos los sirve el backend. Mismo origen: no hace falta CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        # El informe espera la evaluación con IA (hasta ~60 s).
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location /media/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
